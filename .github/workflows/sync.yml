name: sync

on:
  schedule:
    - cron: '17 9 * * *'   # 09:17 UTC daily
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      # Provides the `claude` CLI on PATH and wires up auth from the
      # ANTHROPIC_API_KEY secret.
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}

      - run: bun install

      - run: bun run scripts/sync.ts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: commit
        run: |
          git config user.name "skills-collection[bot]"
          git config user.email "actions@github.com"
          git add dist/
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "sync: $(date -u +%Y-%m-%d)"
            git push
          fi
